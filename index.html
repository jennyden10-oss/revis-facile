
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Révis'Facile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5ff;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { color: #4455aa; }
    .carte {
      background: white;
      border-radius: 16px;
      padding: 30px;
      max-width: 450px;
      margin: 30px auto;
      box-shadow: 0 3px 12px #ddd;
    }
  </style>
</head>
  
<button onclick="testerConnexion()">
  Tester la connexion
</button>

<p id="resultat"></p>

<script>
async function testerConnexion() {
  const resultat = document.getElementById("resultat");
  resultat.textContent = "Test en cours...";

  const adresse = prompt(
    "Colle l'adresse Apps Script terminée par ?test=connexion"
  );

  if (!adresse) {
    resultat.textContent = "Test annulé.";
    return;
  }

  try {
    const reponse = await fetch(adresse, {
      method: "GET",
      redirect: "follow"
    });

    const donnees = await reponse.json();
    resultat.textContent =
      "Connexion réussie : " + donnees.connexion;
  } catch (erreur) {
    resultat.textContent =
      "Connexion impossible depuis cette page.";
    console.error(erreur);
  }
}
</script>
<body>
  <div class="carte">
    <h1>Révis'Facile 📚</h1>
    <h2>Bienvenue !</h2>
    <p>Ton application de révision est prête.</p>
    <p>Tu pourras bientôt photographier tes cours
       et t'entraîner avec des quiz.</p>
  </div>
  
<button onclick="testerPost()">
  Tester l'envoi POST
</button>

<p id="resultatPost"></p>

<script>
async function testerPost() {
  const resultat = document.getElementById("resultatPost");

  const adresse = prompt(
    "Colle l'adresse Apps Script terminée par /exec"
  );

  if (!adresse) return;

  resultat.textContent = "Test en cours...";

  try {
    const reponse = await fetch(
      adresse + "?test=connexion",
      {
        method: "POST",
        body: "test",
        redirect: "follow"
      }
    );

    const donnees = await reponse.json();

   resultat.textContent =
  "Réponse reçue : " + JSON.stringify(donnees);

  } catch (erreur) {
    resultat.textContent =
      "Connexion POST impossible.";
    console.error(erreur);
  }
}
</script>

<div class="carte">
  <h2>📚 Ouvrir un questionnaire</h2>

  <input
    id="adresseScript"
    type="url"
    placeholder="Adresse Apps Script"
    style="width:95%;padding:10px;margin:6px 0"
  >

  <input
    id="identifiantQuiz"
    type="text"
    placeholder="Identifiant du questionnaire"
    style="width:95%;padding:10px;margin:6px 0"
  >

  <input
    id="codeFamilial"
    type="password"
    placeholder="Code d'accès familial"
    autocomplete="off"
    style="width:95%;padding:10px;margin:6px 0"
  >

  <button onclick="ouvrirQuestionnaire()">
    Ouvrir le questionnaire
  </button>

  <p id="messageQuiz"></p>
</div>

<script>
async function ouvrirQuestionnaire() {
  const message = document.getElementById("messageQuiz");
  const adresse = document.getElementById("adresseScript")
    .value.trim().split("?")[0];
  const id = document.getElementById("identifiantQuiz")
    .value.trim();
  const code = document.getElementById("codeFamilial").value;

  if (!adresse || !id || !code) {
    message.textContent = "Complète les trois champs.";
    return;
  }

  message.textContent = "Chargement en cours...";

  try {
    const reponse = await fetch(adresse, {
      method: "POST",
      body: JSON.stringify({
        action: "chargerQuiz",
        id: id,
        codeAcces: code
      }),
      redirect: "follow"
    });

    const donnees = await reponse.json();

   if (donnees.succes && donnees.quiz) {
  message.textContent =
    "Questionnaire chargé : " + donnees.quiz.titre;

  // Conserver le questionnaire pour l'interface interactive.
window.quizEnCours = donnees.quiz;
window.codeSessionQuiz = code;
window.adresseSessionQuiz = adresse;
window.idSessionQuiz = id;
positionQuiz = 0;
scoreQuiz = 0;
afficherQuestionQuiz();
} else {
  message.textContent =
    "Accès refusé ou questionnaire introuvable.";
}
  } catch (erreur) {
    message.textContent = "Erreur de connexion.";
    console.error(erreur);
  } finally {
    document.getElementById("codeFamilial").value = "";
  }
}
</script>

<div class="carte" id="zoneQuiz" hidden>
  <h2 id="titreQuiz"></h2>
  <p id="progressionQuiz"></p>
  <h3 id="questionQuiz"></h3>

  <div id="reponsesQuiz"></div>
  <div id="correctionQuiz" aria-live="polite"></div>

  <button id="boutonQuiz" onclick="actionQuiz()">
    Vérifier
  </button>
</div>

<script>
let positionQuiz = 0;
let scoreQuiz = 0;
let choixQuiz = [];
let reponseValidee = false;


function texteNormalise(texte) {
  return String(texte)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLocaleLowerCase("fr")
    .replace(/[’']/g, " ")
    .replace(/[.,;:!?]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}


function afficherQuestionQuiz() {
  const quiz = window.quizEnCours;
  if (!quiz || !quiz.questions) return;

  const q = quiz.questions[positionQuiz];
  choixQuiz = [];
  reponseValidee = false;

  document.getElementById("zoneQuiz").hidden = false;
  document.getElementById("titreQuiz").textContent = quiz.titre;
  document.getElementById("progressionQuiz").textContent =
    "Question " + (positionQuiz + 1) +
    " sur " + quiz.questions.length;
  document.getElementById("questionQuiz").textContent = q.question;

  const zone = document.getElementById("reponsesQuiz");
  zone.replaceChildren();
  document.getElementById("correctionQuiz").replaceChildren();

  document.getElementById("boutonQuiz").textContent = "Vérifier";

  if (["qcm", "multiple", "vrai_faux"].includes(q.type)) {
    q.choix.forEach((choix, i) => {
      const bouton = document.createElement("button");
      bouton.textContent = choix;
      bouton.style.display = "block";
      bouton.style.margin = "10px 0";
      bouton.style.padding = "12px";
      bouton.style.width = "100%";

      bouton.onclick = () => {
        if (reponseValidee) return;

        if (q.type === "multiple") {
          choixQuiz = choixQuiz.includes(i)
            ? choixQuiz.filter(n => n !== i)
            : [...choixQuiz, i];
        } else {
          choixQuiz = [i];
        }

        zone.querySelectorAll("button").forEach((b, j) => {
          b.style.background = choixQuiz.includes(j)
            ? "#dce6ff" : "white";
        });
      };

      zone.appendChild(bouton);
    });
  } else {
    const champ = document.createElement("input");
    champ.type = "text";
    champ.id = "reponseEcriteQuiz";
    champ.placeholder = "Ta réponse…";
    champ.style.width = "100%";
    champ.style.padding = "12px";
    zone.appendChild(champ);
  }
}

async function verifierAvecGeminiQuiz(reponseEleve) {
  const adresse = window.adresseSessionQuiz;
  const id = window.idSessionQuiz;
  const code = window.codeSessionQuiz;

  if (!adresse || !id || !code) {
    throw new Error("Session de révision indisponible.");
  }

  const resultat = await fetch(adresse, {
    method: "POST",
    body: JSON.stringify({
      action: "verifierReponse",
      id: id,
      index: positionQuiz,
      reponse: reponseEleve,
      codeAcces: code
    }),
    redirect: "follow"
  });

  if (!resultat.ok) {
    throw new Error("Erreur de connexion.");
  }

  const donnees = await resultat.json();

  if (!donnees.succes ||
      typeof donnees.correcte !== "boolean") {
    throw new Error("Vérification indisponible.");
  }

  return donnees.correcte;
}

async function actionQuiz() {
  const quiz = window.quizEnCours;
  const q = quiz.questions[positionQuiz];

  if (reponseValidee) {
    positionQuiz++;

    if (positionQuiz >= quiz.questions.length) {
      document.getElementById("zoneQuiz").innerHTML =
        "<h2>🎉 Entraînement terminé !</h2>" +
        "<h2>" + scoreQuiz + " / " +
        quiz.questions.length + "</h2>";
    } else {
      afficherQuestionQuiz();
    }
    return;
  }

  let juste = false;
  let attendu = "";

  if (["qcm", "multiple", "vrai_faux"].includes(q.type)) {
    if (!choixQuiz.length) return;

    juste = choixQuiz.length === q.correctes.length &&
      q.correctes.every(n => choixQuiz.includes(n));

    attendu = q.correctes.map(n => q.choix[n]).join(", ");
  } else {
    const champ = document.getElementById("reponseEcriteQuiz");
    if (!champ.value.trim()) return;

    
juste = q.reponsesAcceptees.some(
  r => texteNormalise(r) === texteNormalise(champ.value)
);

attendu = q.reponsesAcceptees[0];

if (!juste) {
  const bouton = document.getElementById("boutonQuiz");
  const ancienTexte = bouton.textContent;

  bouton.disabled = true;
  bouton.textContent = "Vérification en cours…";

  try {
    juste = await verifierAvecGeminiQuiz(champ.value);
  } catch (erreur) {
    console.error("Correction indisponible :", erreur);

    const correction = document.getElementById("correctionQuiz");
    correction.textContent =
      "Impossible de vérifier cette formulation pour le moment. " +
      "Ta réponse n'est pas comptée comme fausse. Réessaie.";

    return;
  } finally {
    bouton.disabled = false;
    bouton.textContent = ancienTexte;
  }
}

champ.disabled = true;

  }

  reponseValidee = true;
  if (juste) scoreQuiz++;

  const correction = document.getElementById("correctionQuiz");
  const titre = document.createElement("p");
  titre.textContent = juste
    ? "✓ Bonne réponse !" : "✗ Pas tout à fait.";
  correction.appendChild(titre);

  if (!juste) {
    const p = document.createElement("p");
    p.textContent = "Bonne réponse : " + attendu;
    correction.appendChild(p);
  }

  const explication = document.createElement("p");
  explication.textContent = q.explication;
  correction.appendChild(explication);

  document.getElementById("boutonQuiz").textContent =
    positionQuiz + 1 === quiz.questions.length
      ? "Voir mon résultat" : "Continuer";
}
</script>

</body>
</html>
