
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Révis'Facile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5ff;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { color: #4455aa; }
    .carte {
      background: white;
      border-radius: 16px;
      padding: 30px;
      max-width: 450px;
      margin: 30px auto;
      box-shadow: 0 3px 12px #ddd;
    }
  </style>
</head>
  
<button onclick="testerConnexion()">
  Tester la connexion
</button>

<p id="resultat"></p>

<script>
async function testerConnexion() {
  const resultat = document.getElementById("resultat");
  resultat.textContent = "Test en cours...";

  const adresse = prompt(
    "Colle l'adresse Apps Script terminée par ?test=connexion"
  );

  if (!adresse) {
    resultat.textContent = "Test annulé.";
    return;
  }

  try {
    const reponse = await fetch(adresse, {
      method: "GET",
      redirect: "follow"
    });

    const donnees = await reponse.json();
    resultat.textContent =
      "Connexion réussie : " + donnees.connexion;
  } catch (erreur) {
    resultat.textContent =
      "Connexion impossible depuis cette page.";
    console.error(erreur);
  }
}
</script>
<body>
  <div class="carte">
    <h1>Révis'Facile 📚</h1>
    <h2>Bienvenue !</h2>
    <p>Ton application de révision est prête.</p>
    <p>Tu pourras bientôt photographier tes cours
       et t'entraîner avec des quiz.</p>
  </div>
  
<button onclick="testerPost()">
  Tester l'envoi POST
</button>

<p id="resultatPost"></p>

<script>
async function testerPost() {
  const resultat = document.getElementById("resultatPost");

  const adresse = prompt(
    "Colle l'adresse Apps Script terminée par /exec"
  );

  if (!adresse) return;

  resultat.textContent = "Test en cours...";

  try {
    const reponse = await fetch(
      adresse + "?test=connexion",
      {
        method: "POST",
        body: "test",
        redirect: "follow"
      }
    );

    const donnees = await reponse.json();

   resultat.textContent =
  "Réponse reçue : " + JSON.stringify(donnees);

  } catch (erreur) {
    resultat.textContent =
      "Connexion POST impossible.";
    console.error(erreur);
  }
}
</script>

<div class="carte">
  <h2>📚 Ouvrir un questionnaire</h2>

  <input
    id="adresseScript"
    type="url"
    placeholder="Adresse Apps Script"
    style="width:95%;padding:10px;margin:6px 0"
  >

  <input
    id="identifiantQuiz"
    type="text"
    placeholder="Identifiant du questionnaire"
    style="width:95%;padding:10px;margin:6px 0"
  >

  <input
    id="codeFamilial"
    type="password"
    placeholder="Code d'accès familial"
    autocomplete="off"
    style="width:95%;padding:10px;margin:6px 0"
  >

  <button onclick="ouvrirQuestionnaire()">
    Ouvrir le questionnaire
  </button>

  <p id="messageQuiz"></p>
</div>

<script>
async function ouvrirQuestionnaire() {
  const message = document.getElementById("messageQuiz");
  const adresse = document.getElementById("adresseScript")
    .value.trim().split("?")[0];
  const id = document.getElementById("identifiantQuiz")
    .value.trim();
  const code = document.getElementById("codeFamilial").value;

  if (!adresse || !id || !code) {
    message.textContent = "Complète les trois champs.";
    return;
  }

  message.textContent = "Chargement en cours...";

  try {
    const reponse = await fetch(adresse, {
      method: "POST",
      body: JSON.stringify({
        action: "chargerQuiz",
        id: id,
        codeAcces: code
      }),
      redirect: "follow"
    });

    const donnees = await reponse.json();

   if (donnees.succes && donnees.quiz) {
  message.textContent =
    "Questionnaire chargé : " + donnees.quiz.titre;

  // Conserver le questionnaire pour l'interface interactive.
  window.quizEnCours = donnees.quiz;
} else {
  message.textContent =
    "Accès refusé ou questionnaire introuvable.";
}
  } catch (erreur) {
    message.textContent = "Erreur de connexion.";
    console.error(erreur);
  } finally {
    document.getElementById("codeFamilial").value = "";
  }
}
</script>

</body>
</html>
